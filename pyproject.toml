[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finforecast-platform"
version = "2.1.0"
description = "Leakage-safe probabilistic forecasting and model promotion reference platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
test = ["httpx>=0.28", "pytest>=8.0", "ruff>=0.12"]

[project.scripts]
finforecast = "finforecast.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "finforecast*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
